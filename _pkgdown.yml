url: https://statmodels7.github.io/modelterms7

template:
  bootstrap: 5

navbar:
  structure:
    left:  [reference]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: The classes and the generics
  desc: >
    The two branches of the class tree and the generics that a term
    implements: building a block from data, reproducing that block on new
    rows, and reporting coefficients, hyperparameters and penalties. A
    structural term implements a filter or a likelihood instead of a block.
  contents:
  - model_term
  - additive_term
  - structural_term
  - term_build
  - term_is_built
  - term_matrix
  - term_penalty
  - term_penalties
  - term_components
  - term_hyper
  - term_grid
  - term_values
  - term_path_min
  - term_search
  - term_ids
  - term_npar
  - term_coef_start
  - term_coef_draw
  - term_jacobian_block
  - term_kinks
  - term_kink_constraints
  - term_held
  - term_tag
  - term_group
  - term_within
  - term_coef_names
  - term_smooth
  - term_predict
- title: The parametric term
  desc: >
    The unpenalized block of a one-sided formula, with the usual
    model.matrix conventions for factors, contrasts and the
    intercept.
  contents:
  - linpar
  - LinparTerm
- title: The penalized terms
  desc: >
    A block with a penalties7 object attached to its coefficients:
    ridge, lasso, SCAD, MCP and the elastic net, over a formula or
    over a matrix column of the data.
  contents:
  - ridge
  - lasso
  - enet
  - scad
  - mcp
  - penalized_terms
  - PenalizedTerm
- title: The random-effect term
  desc: >
    Grouped intercepts, slopes and smooth curves, in which the distribution
    of the effects is attached as the penalty. This is how a random effect
    enters a penalized likelihood.
  contents:
  - random
  - RandomTerm
  - RandomSmoothTerm
- title: Smooth terms
  desc: >
    The penalized smooths of one and of several covariates, built on the
    smoothers of basis7: s() for one covariate and te() for a tensor
    product, anisotropic by default.
  contents:
  - s
  - te
  - SmoothTerm
- title: Shape-constrained smooths
  desc: >
    A smooth of one covariate constrained to be monotone, convex or concave,
    through a map from free coefficients to the B-spline coefficients, with a
    penalty on the free coefficients.
  contents:
  - scs
  - ScsTerm
  - shape_constructors
  - shape_constraint
  - shape_map
  - shape_start
- title: Nonlinear terms
  desc: >
    A contribution nonlinear in its own parameters, whose block is
    the Jacobian recomputed as they move, so a linear fit on it is
    a Gauss-Newton step.
  contents:
  - nl
  - nl_fderiv
  - NlTerm
  - term_refresh
  - term_block_contract
  - term_block_deriv
  - term_block_deriv2
  - term_value
  - term_converged
  - term_stalled
- title: Break-point terms
  desc: >
    The break-points at which an effect changes slope, level or both.
    The sharp constructions are estimated through a working linear model
    in the break-point position, a smoothed construction treats each
    break-point as an ordinary parameter, and the grid rule chooses where
    to start.
  contents:
  - seg
  - jump
  - jseg
  - SegTerm
  - seg_psi
  - seg_step
  - seg_start
  - seg_reheat
  - seg_relocate
  - seg_polish
  - seg_profile_rss
  - seg_polish_exact
  - seg_profile_intervals
  - seg_hold
  - seg_pin
  - seg_limits
- title: Structural terms
  desc: >
    Terms that rewrite the likelihood instead of adding to the
    predictor: score-driven dynamics, a latent Markov chain and
    break-points integrated out of the likelihood. Each of these terms carries
    its exact derivatives through its recursion.
  contents:
  - gas
  - GasTerm
  - gas_joint
  - GasJoint
  - GasDriver
  - regime
  - RegimeTerm
  - MarginalBreakTerm
  - term_params
  - term_links
  - term_charted
  - term_start
  - term_starts
  - term_draw
  - term_level_design
  - term_filter
  - term_static_deriv
  - term_continue
  - term_simulate
  - term_loglik
  - term_adjoint
  - term_curvature
  - term_third
  - term_fourth
  - term_fifth
  - term_hessian
  - term_scores
  - term_posterior
  - term_shift_jacobian
  - term_levels
  - term_latent
  - term_level_param
  - term_readable
- title: The formula layer
  desc: >
    Reading a model formula into terms. A call is a term when its value
    inherits from model_term, whatever the name of the function, so a
    term class defined outside the package needs no registration.
  contents:
  - interpret_formula
- title: The response
  desc: >
    Marking a censored response on the left side of a formula and deriving
    the status of each observation from the values that are given.
    statmodels7::statmod() rejects a censored response.
  contents:
  - cens
  - censored_response
- title: Fitted views
  desc: >
    The effective degrees of freedom of a term, computed from the
    coefficients, the curvature and the hyperparameters of a fit: one for
    each unpenalized parameter, a count of the nonzero coefficients under
    a kinked penalty, and one trace over the remaining parameters.
  contents:
  - edf
- title: Validation
  desc: >
    The structural checks of an additive term against a data frame,
    among them the subset check that a term fails when it rebuilds its
    block instead of reapplying its `build_info`.
  contents:
  - check_term
